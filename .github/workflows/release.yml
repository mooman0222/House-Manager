name: release-apk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: 署名鍵を復元
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
        env: { KEYSTORE_BASE64: "${{ secrets.KEYSTORE_BASE64 }}" }
      - name: release APK をビルド
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      - name: Release に公開
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk house-report.apk
          tag="build-${{ github.run_number }}"
          gh release create "$tag" house-report.apk --title "物件レポート build ${{ github.run_number }}" \
            --notes "コミット ${{ github.sha }} から自動ビルド。インストール方法は README を参照。"
